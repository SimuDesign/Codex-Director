name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, and draft release
    if: github.repository == 'SimuDesign/Codex-Director' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and project version
        run: ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Audit the complete public history
        run: ./scripts/audit-public-release.sh --all

      - name: Run full source verification
        run: ./scripts/verify.sh

      - name: Build universal Release app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/codex-director-xcode
        run: ./scripts/build-local-app.sh

      - name: Package and verify release artifacts
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/codex-director-xcode
        run: |
          ./scripts/package-release.sh \
            --output "${RUNNER_TEMP}/release" \
            --source-commit "${GITHUB_SHA}" \
            --source-tag "${GITHUB_REF_NAME}"

      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS.txt

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Codex-Director-${{ github.ref_name }}-release
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/BUILD-INFO.json
            ${{ runner.temp }}/release/DEPENDENCIES.json
          if-no-files-found: error
          retention-days: 30

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}"/release/*.zip \
            "${RUNNER_TEMP}/release/SHA256SUMS.txt" \
            "${RUNNER_TEMP}/release/BUILD-INFO.json" \
            "${RUNNER_TEMP}/release/DEPENDENCIES.json" \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "Codex Director ${GITHUB_REF_NAME}"
