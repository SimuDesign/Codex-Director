name: Bug report
description: Report a reproducible Codex Director problem using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include prompts, capability bodies, usernames, private paths, sessions, credentials, cookies, databases, or capability packages.
  - type: input
    id: version
    attributes:
      label: Codex Director version
      placeholder: 1.0.0 (20)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic names, paths, and capability content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private paths, capability content, sessions, credentials, cookies, and personal data.
          required: true
